# Bootstrap configuration used before the first real certificate is issued.
global
    user haproxy
    group haproxy
    daemon
defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend api_http
    bind :80
    bind [::]:80 v6only
    acl one_host req.hdr_cnt(host) eq 1
    acl api_host req.hdr(host),lower -m str api.daclify.com api.daclify.com:80 testnet.api.daclify.com testnet.api.daclify.com:80
    acl acme_path path_reg ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$
    http-request deny deny_status 400 unless one_host
    http-request deny deny_status 421 unless api_host
    http-request return status 503 content-type text/plain string "API setup pending" unless acme_path
    use_backend acme_webroot if acme_path
backend acme_webroot
    server acme 127.0.0.1:9080
