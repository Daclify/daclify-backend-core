global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend api_http
    bind :80
    bind [::]:80 v6only
    acl one_host req.hdr_cnt(host) eq 1
    acl mainnet_host req.hdr(host),lower -m str api.daclify.com api.daclify.com:80
    acl testnet_host req.hdr(host),lower -m str testnet.api.daclify.com testnet.api.daclify.com:80
    acl acme_path path_reg ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$
    http-request deny deny_status 400 unless one_host
    http-request deny deny_status 421 unless mainnet_host or testnet_host
    http-request redirect scheme https code 308 unless acme_path
    use_backend acme_webroot if acme_path

frontend api_https
    bind :443 ssl crt /etc/haproxy/certs/daclify-api.pem alpn h2,http/1.1
    bind [::]:443 v6only ssl crt /etc/haproxy/certs/daclify-api.pem alpn h2,http/1.1
    acl one_host req.hdr_cnt(host) eq 1
    acl mainnet_host req.hdr(host),lower -m str api.daclify.com api.daclify.com:443
    acl testnet_host req.hdr(host),lower -m str testnet.api.daclify.com testnet.api.daclify.com:443
    acl mainnet_sni ssl_fc_sni -i api.daclify.com
    acl testnet_sni ssl_fc_sni -i testnet.api.daclify.com
    http-request deny deny_status 400 unless one_host
    http-request deny deny_status 421 unless mainnet_host or testnet_host
    http-request deny deny_status 421 if mainnet_host !mainnet_sni
    http-request deny deny_status 421 if testnet_host !testnet_sni
    http-request del-header Forwarded
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Port 443
    use_backend api_mainnet if mainnet_host
    use_backend api_testnet if testnet_host

backend api_mainnet
    retries 0
    option httpchk GET /v1/network
    http-check expect status 200
    server mainnet 127.0.0.1:3018 check inter 5s fall 2 rise 2

backend api_testnet
    retries 0
    option httpchk GET /v1/network
    http-check expect status 200
    server testnet 127.0.0.1:3028 check inter 5s fall 2 rise 2

backend acme_webroot
    server acme 127.0.0.1:9080
